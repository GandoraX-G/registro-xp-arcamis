# Applica le migrazioni D1 al database di produzione.
# Si avvia a mano da Actions → «D1 migrate» → Run workflow.
# Richiede due secret del repository: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: D1 migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa wrangler
        run: npm install --no-save wrangler@4

      - name: Verifica le credenziali
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Manca il secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          npx wrangler whoami

      - name: Migrazione 0006 (cestino diari, rimozione presenze)
        run: npx wrangler d1 execute arcamis-register --remote --file migrations/0006_diary_trash_and_drop_attendance.sql

      - name: Migrazione 0007 (firma delle sessioni)
        run: |
          set +e
          HAVE=$(npx wrangler d1 execute arcamis-register --remote --json \
            --command "SELECT name FROM pragma_table_info('xp_entries') WHERE name='created_by'" \
            | grep -c created_by)
          if [ "$HAVE" = "0" ]; then
            npx wrangler d1 execute arcamis-register --remote --file migrations/0007_session_signature.sql
          else
            echo "0007 già applicata: colonna created_by presente."
          fi

      - name: Stato finale dello schema
        run: |
          npx wrangler d1 execute arcamis-register --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('adventure_trash','xp_entry_trash','session_participation')"
          npx wrangler d1 execute arcamis-register --remote --json \
            --command "SELECT name FROM pragma_table_info('xp_entries') WHERE name='created_by'"
          npx wrangler d1 execute arcamis-register --remote --json \
            --command "SELECT name FROM pragma_table_info('session_participation')"

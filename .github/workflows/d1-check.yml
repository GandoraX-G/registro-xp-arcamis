# Verifica in sola lettura dello schema D1 di produzione.
# Si avvia a mano da Actions → «D1 check» → Run workflow. Non modifica nulla.
name: D1 check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_NAME: arcamis-register
  DB_ID: f8ac45cd-6635-409c-b529-dc1a12d5c8b2

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa wrangler
        run: npm install --no-save --silent --no-audit --no-fund wrangler@4

      - name: Stato dello schema
        run: |
          set -e
          extra=$(npx wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | sort -u | tr '\n' ' ')
          acc=""
          for a in $CLOUDFLARE_ACCOUNT_ID $extra; do
            [ -n "$a" ] || continue
            ids=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$a/d1/database" \
              | tr ',' '\n' | grep -o '"uuid":"[^"]*"' | cut -d'"' -f4 | tr '\n' ' ')
            case " $ids " in *" $DB_ID "*) acc="$a"; break ;; esac
          done
          if [ -z "$acc" ]; then echo "::error::account del database non trovato"; exit 1; fi

          SQL="SELECT 'adventure_trash='||(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='adventure_trash')
            ||' xp_entry_trash='||(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='xp_entry_trash')
            ||' player_notes='||(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='player_notes')
            ||' created_by_xp_entries='||(SELECT COUNT(*) FROM pragma_table_info('xp_entries') WHERE name='created_by')
            ||' created_by_trash='||(SELECT COUNT(*) FROM pragma_table_info('xp_entry_trash') WHERE name='created_by')
            ||' attendance='||(SELECT COUNT(*) FROM pragma_table_info('session_participation') WHERE name='attendance')
            AS stato"

          CLOUDFLARE_ACCOUNT_ID="$acc" npx wrangler d1 execute "$DB_NAME" --remote --json --command "$SQL"

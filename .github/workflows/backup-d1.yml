name: Backup del database D1

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev || npm install --omit=dev
      - name: Esporta il database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export arcamis-register --remote --output "backup-$(date +%F).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup
          path: backup-*.sql
          retention-days: 90

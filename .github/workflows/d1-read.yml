# Interroga il database D1 di produzione in sola lettura.
# Actions → «D1 read» → Run workflow, incollando una query SELECT.
name: D1 read

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'Query di sola lettura (deve iniziare con SELECT o WITH)'
        required: true
        default: 'SELECT 1 AS ok'

permissions:
  contents: read

env:
  DB_NAME: arcamis-register
  DB_ID: f8ac45cd-6635-409c-b529-dc1a12d5c8b2

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa wrangler
        run: npm install --no-save --silent --no-audit --no-fund wrangler@4

      - name: Esegui la query
        env:
          SQL: ${{ inputs.sql }}
        run: |
          set -e
          case "$SQL" in
            SELECT*|WITH*|select*|with*) ;;
            *) echo "::error::Sono ammesse solo query SELECT o WITH"; exit 1 ;;
          esac
          case "$SQL" in
            *';'*) echo "::error::Una sola istruzione: niente punto e virgola"; exit 1 ;;
          esac

          extra=$(npx wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | sort -u | tr '\n' ' ')
          acc=""
          for a in $CLOUDFLARE_ACCOUNT_ID $extra; do
            [ -n "$a" ] || continue
            ids=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$a/d1/database" \
              | tr ',' '\n' | grep -o '"uuid":"[^"]*"' | cut -d'"' -f4 | tr '\n' ' ')
            case " $ids " in *" $DB_ID "*) acc="$a"; break ;; esac
          done
          if [ -z "$acc" ]; then echo "::error::account del database non trovato"; exit 1; fi

          CLOUDFLARE_ACCOUNT_ID="$acc" npx wrangler d1 execute "$DB_NAME" --remote --json --command "$SQL"
